# Workspace build configuration.
# All build output goes to artifacts/ (gitignored contents, folder tracked
# via .gitkeep) — builds never go to target/.
[build]
target-dir = "artifacts/target"

# Default: dynamic musl (the GUI links libxkbcommon dynamically — Alpine ships
# no .a). The release build overrides this for `ursined`/`ursinectl` with
# `CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=... +crt-static`, which
# yields zero dynamic dependencies for the daemon and CLI.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]
